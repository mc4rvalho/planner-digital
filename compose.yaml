services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - planner_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: config/.env
    environment:
      DATABASE_URL: postgresql://planner:planner@db:5432/planner
      FRONTEND_URL: http://localhost:8080
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
volumes:
  planner_db:
